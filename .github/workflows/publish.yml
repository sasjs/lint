name: SASjs Lint Build and Publish

# Publishes the version the release names, and only that.
#
# This file is the one npm's trusted publisher is registered against, because the
# registry validates the workflow that actually runs `npm publish` (the OIDC
# `job_workflow_ref` claim) - not the workflow that triggered it. Keeping the tag
# in release.yml means neither job holds the other's permission: the release job
# never sees id-token, and this job never sees contents: write.
#
# A `release: published` trigger would not work and would fail silently: a release
# created with the pipeline's own GITHUB_TOKEN fires no events, because GitHub
# suppresses them to stop recursion. workflow_run is not suppressed, so publishing
# is chained off the Release workflow finishing.
#
# Nothing is committed. The tag is the version; it is stamped into the working
# tree because npm reads package.json, and the tree is thrown away.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  # a publish that failed can be retried: the release event fires once, and
  # re-creating the release to republish is exactly the state to avoid
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to publish. Required when dispatched; when this runs from
          the Release workflow, leave it blank and the tag that run created is
          used. Must be on main.
        required: false
        default: ''
      republish:
        description: Publish even when the registry already serves this version
        required: false
        type: boolean
        default: false

# read-only by default; the build asks only for the identity it publishes with
permissions:
  contents: read
  id-token: write # trusted publishing: the OIDC token is the credential

# one publish at a time: a dispatched retry must not interleave with a run the
# Release workflow started
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # a fork must not publish one of the org's packages, and a release run that
    # failed has nothing to publish
    if: |
      github.repository == 'sasjs/lint' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always main: a dispatch can name any ref, and the tag gate below
          # treats HEAD as the default branch. Publishing is from main or not at
          # all, so the checkout says so rather than inheriting the dispatcher's
          # choice.
          ref: main
          # the tag is how this workflow learns what to publish: the release run
          # created it at the commit it released
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x - OIDC trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      # Install from main's lockfile, not from the yet-unverified tag. Keep this
      # exact released tool across checkout and the tag's own npm ci.
      - name: Install the release tool
        run: |
          npm ci
          cp node_modules/@sasjs/release/release.mjs "$RUNNER_TEMP/sasjs-release.mjs"

      - name: Resolve and gate the tag
        id: resolve
        timeout-minutes: 5
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          set -euo pipefail
          args=(--prepare-publish --branch main --dry-run --output "$GITHUB_OUTPUT")
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -z "$REQUESTED" ]; then
              echo "::error::no tag - dispatch this with the tag to publish"
              exit 1
            fi
            # The tool accepts any commit-ish as --tag. This workflow accepts
            # only actual tags, and must not let git revision syntax impersonate one.
            git show-ref --verify --quiet "refs/tags/$REQUESTED" || { echo "::error::not a tag: $REQUESTED"; exit 1; }
            [[ "$REQUESTED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::tag must start with v and a version"; exit 1; }
            args+=(--tag "$REQUESTED")
          elif [ "$EVENT" = workflow_run ] && [ -n "$SHA" ]; then
            git cat-file -e "${SHA}^{commit}" || { echo "::error::unknown workflow run SHA"; exit 1; }
            args+=(--sha "$SHA")
          else
            echo "::error::unexpected event or missing workflow run SHA"
            exit 1
          fi
          if [ "$REPUBLISH" = true ]; then args+=(--republish); fi
          node "$RUNNER_TEMP/sasjs-release.mjs" "${args[@]}"

      - name: Report when no tag was created
        if: steps.resolve.outputs.skip == 'true'
        run: echo "::notice::the release run created no version tag at its commit"

      - name: Verify the resolved tag is on the checked-out main
        if: steps.resolve.outputs.skip == 'false'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$TAG"
          git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" HEAD || { echo "::error::$TAG is not on checked-out main"; exit 1; }

      - name: Check out the tag
        if: steps.resolve.outputs.skip == 'false'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: git checkout -q "refs/tags/$TAG"

      - name: Prepare publish from the tag
        id: prepare
        timeout-minutes: 5
        if: steps.resolve.outputs.skip == 'false'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo "::error::missing resolved tag"; exit 1; }
          args=(--prepare-publish --branch main --tag "$TAG" --output "$GITHUB_OUTPUT")
          if [ "$REPUBLISH" = true ]; then args+=(--republish); fi
          node "$RUNNER_TEMP/sasjs-release.mjs" "${args[@]}"

      # The release tool stamps package.json; npm validates the complete semver
      # and updates the lockfile as the previous workflow did.
      - name: Validate and synchronize the stamped version
        if: steps.prepare.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install Dependencies
        if: steps.prepare.outputs.skip == 'false'
        run: npm ci

      - name: Check Code Style
        if: steps.prepare.outputs.skip == 'false'
        run: npm run lint

      - name: Run Unit Tests
        if: steps.prepare.outputs.skip == 'false'
        run: npm test

      - name: Build Project
        if: steps.prepare.outputs.skip == 'false'
        run: npm run build

      - name: Clean up ready for publishing
        if: steps.prepare.outputs.skip == 'false'
        run: npm run publishInit

      # `files` names build outputs, which do not exist in a checkout, and npm
      # does not fail on an entry that matches nothing - so a renamed path
      # publishes a package quietly missing that surface. This fails before the
      # package goes to the registry rather than in a consumer.
      - name: Check the tarball carries the public API
        if: steps.prepare.outputs.skip == 'false'
        run: npm run check:package

      - name: The version is the tag's
        # prepublishOnly refuses the 0.0.0 placeholder, and the publish step below
        # re-enables it with --ignore-scripts=false, so that case is already
        # covered. This checks what prepublishOnly cannot see: that the version
        # npm is about to read is the tag's, not merely non-placeholder.
        if: steps.prepare.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          stamped="$(node -p "require('./package.json').version")"
          echo "stamped $stamped, tag says $VERSION"
          if [ "$stamped" != "$VERSION" ]; then
            echo "::error::package.json states $stamped but the tag names $VERSION"
            exit 1
          fi

      - name: Publish to npm with trusted publisher
        if: steps.prepare.outputs.skip == 'false' && steps.prepare.outputs.publish == 'true'
        # no NODE_AUTH_TOKEN: the OIDC token is exchanged for a short-lived
        # credential, so there is no long-lived secret in this repository.
        # --ignore-scripts=false re-enables this package's own prepublishOnly,
        # which .npmrc disables for every other command; nothing is installed at
        # publish time, so no dependency's script can run from it.
        run: npm publish --access public --ignore-scripts=false
