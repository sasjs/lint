name: Audit Watch

# The build gate audits the whole tree, dev dependencies included, and carries an
# EXEMPTIONS list for the one advisory that cannot be fixed from here
# (GHSA-gcqx-w48m-w2h4, deepmerge through jest - see the Security Audit step in
# build.yml). Nothing in build.yml re-checks whether that exemption is still
# justified, so this runs the full audit weekly and fails when it stops matching
# reality: a new dev-tree advisory appears, an exempted one disappears, or a
# package named in the exemption publishes a newer release. Any of those files an
# issue - and only those, because a scheduled job that is red every week trains
# people to ignore red.

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays, 08:00 UTC
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Re-check the dev-tree audit exemption
        id: watch
        env:
          AUDIT_WATCH_REPORT: ${{ runner.temp }}/audit-watch-report.md
        run: node scripts/audit-watch.mjs

      - name: File an issue
        # `always()` because the watched step has already failed, which would
        # otherwise skip this one.
        if: always() && steps.watch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/audit-watch-report.md
        run: |
          title='Audit watch: the dev-tree exemption needs re-evaluating'
          existing=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "already tracked in #$existing"
            exit 0
          fi

          if [ -f "$REPORT" ]; then
            gh issue create --title "$title" --body-file "$REPORT"
          else
            # The script writes a report even when the watch itself breaks, so
            # this means it never started. File the issue anyway rather than
            # failing on a missing path and filing nothing.
            gh issue create --title "$title" --body \
              "The audit watch step failed before producing a report. Check the run:
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
