name: Audit Watch

# Run the same full-tree audit as the build every week. On failure, create an
# issue or append the latest report to the existing open audit issue, so new
# findings are not silently hidden by deduplication.
on:
  schedule:
    - cron: '0 8 * * 1' # Mondays, 08:00 UTC
  workflow_dispatch:

# read-only by default; the watch job asks for the issue write it needs
permissions: read-all

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Audit the full dependency tree
        id: watch
        env:
          AUDIT_WATCH_REPORT: ${{ runner.temp }}/audit-watch-report.md
        run: node scripts/audit-watch.mjs

      - name: File an issue
        # `always()` because the watched step has already failed, which would
        # otherwise skip this one.
        if: always() && steps.watch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/audit-watch-report.md
        run: |
          title='Audit watch: dependency audit failed'
          existing=$(gh issue list --state open --search "\"$title\" in:title" \
            --limit 1000 --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")

          if [ -f "$REPORT" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file "$REPORT"
            else
              gh issue create --title "$title" --body-file "$REPORT"
            fi
          else
            # The watch failed before writing a report; keep the run link.
            body="The audit watch step failed before producing a report. Check the run:
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          fi
