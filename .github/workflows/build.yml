# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: SASjs Lint Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Scan for secrets (gitleaks)
        # The local pre-commit hook is suppressed entirely when .npmrc sets
        # ignore-scripts=true (the prepare script that would activate the
        # hooks never runs), so CI is the enforcement point: a leaked
        # credential must fail the build, not just a commit.
        # Uses the same @nogoo9/gitleaks binary the pre-commit hook pins - the
        # gitleaks-action requires a license key for organization repos.
        run: node_modules/.bin/gitleaks detect --source . --redact --no-banner -v
      - name: Security Audit
        # The release toolchain is not a project dependency (see publish.yml),
        # so the `npm` package bundled by @semantic-release/npm never reaches
        # this tree - which is what made the old exemption-based audit script
        # necessary. A plain audit is clean.
        run: npm audit
      - name: Check Code Style
        run: npm run lint
      - name: Run Unit Tests
        run: npm test
      - name: Build Package
        run: npm run package:lib
        env:
          CI: true
