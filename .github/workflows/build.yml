# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: SASjs Lint Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The floor is what the manifest declares; lts/* tracks the newest LTS.
        # Testing only lts/* would let a change that breaks node 22 ship, since
        # lts/* already resolves to 24.
        node-version: [22, lts/*]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Scan for secrets (gitleaks)
        # The local pre-commit hook is suppressed entirely when .npmrc sets
        # ignore-scripts=true (the prepare script that would activate the
        # hooks never runs), so CI is the enforcement point: a leaked
        # credential must fail the build, not just a commit.
        # Uses the same @nogoo9/gitleaks binary the pre-commit hook pins - the
        # gitleaks-action requires a license key for organization repos.
        run: node_modules/.bin/gitleaks detect --source . --redact --no-banner -v
      - name: Security Audit
        # The whole tree is audited, dev dependencies included: a dev-tree
        # advisory is still a package this repo installs and runs, and excluding
        # that half is how a scoped gate becomes permanent.
        # `scripts/audit-watch.mjs` fails on any advisory that is not in its
        # EXEMPTIONS list, on an exemption that stops appearing in the tree, and
        # on an exempted advisory reported at a path its entry does not cover.
        # `--gate` leaves out the registry check, so a new release of a watched
        # package cannot turn a PR red for something the branch cannot fix.
        #
        # The one exemption is GHSA-gcqx-w48m-w2h4: deepmerge 4.3.1, reached
        # through jest 30.5.2 -> @jest/core -> jest-config. 4.3.1 is the newest
        # release, the advisory names no patched version at any range, and
        # jest-config is at its latest published version; an `overrides` entry
        # can only pin a version that does not exist. The input it poisons is
        # this repository's own jest configuration, not package data or a
        # request body - which is why the risk is small, and not a reason to
        # keep the advisory out of the report.
        #
        # This step checks the tree: the advisory is present, at a path the entry
        # covers, and named in this comment. It does not decide whether the
        # exemption is still justified - `--gate` skips the registry check on
        # purpose, so a package publishing a fix cannot turn a PR red.
        # audit-watch.yml runs the same script weekly without `--gate`, and that
        # run is what re-validates the exemption and raises an issue when
        # deepmerge publishes a patched release. Keep the GHSA id named here and
        # in EXEMPTIONS in scripts/audit-watch.mjs: the script fails when the two
        # disagree.
        run: node scripts/audit-watch.mjs --gate
      - name: Check Code Style
        run: npm run lint
      - name: Run Unit Tests
        run: npm test
      - name: Build Package
        run: npm run package:lib
        env:
          CI: true
