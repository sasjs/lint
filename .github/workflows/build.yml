# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: SASjs Lint Build

on:
  push:
  pull_request:

# read-only: the job builds and tests, and never writes to the repository
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The floor is what the manifest declares; lts/* tracks the newest LTS.
        # Testing only lts/* would let a change that breaks node 22 ship, since
        # lts/* already resolves to 24.
        node-version: [22, lts/*]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Scan for secrets (gitleaks)
        # The local pre-commit hook is suppressed entirely when .npmrc sets
        # ignore-scripts=true (the prepare script that would activate the
        # hooks never runs), so CI is the enforcement point: a leaked
        # credential must fail the build, not just a commit.
        # Uses the same @nogoo9/gitleaks binary the pre-commit hook pins - the
        # gitleaks-action requires a license key for organization repos.
        run: node_modules/.bin/gitleaks detect --source . --redact --no-banner -v
      - name: Security Audit
        # Audit every dependency type at every severity. The script fails on
        # any vulnerability or an invalid or unsuccessful npm audit report;
        # there are no exemptions. The weekly watch runs the same full audit.
        run: node scripts/audit-watch.mjs
      - name: Verify publish workflow gates
        run: node --test scripts/test-publish-workflow.mjs
      - name: Check Code Style
        run: npm run lint
      - name: Run Unit Tests
        run: npm test
      - name: Build Package
        run: npm run package:lib
        env:
          CI: true
