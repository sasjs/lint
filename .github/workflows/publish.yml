# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: SASjs Lint Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # required for npm provenance (trusted publisher)
      issues: write         # optional: lets @semantic-release/github comment on issues
      pull-requests: write  # optional: lets @semantic-release/github comment on PRs

    strategy:
      matrix:
        node-version: [22]

    steps:
      # Mint a short-lived GitHub App token (bypass-capable)
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Checkout using the app token so the release commit can be pushed
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0      # semantic-release needs full history + tags

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x — OIDC trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Style
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Project
        run: npm run build

      - name: Clean up ready for publishing
        run: npm run publishInit

      - name: Semantic Release
        # The release toolchain is deliberately not a project dependency: every
        # @semantic-release plugin declares a `semantic-release` peer, which npm
        # auto-installs together with the `npm` package semantic-release bundles
        # - and that bundled npm carries advisories nothing here can fix.
        # Installing it here, pinned, keeps the dependency tree clean. Keep
        # these versions in step with `release.plugins` in package.json.
        run: |
          npx --yes \
            --package semantic-release@25.0.9 \
            --package @semantic-release/exec@7.1.0 \
            --package @semantic-release/git@11.0.1 \
            semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}   # <-- app token, not secrets.GITHUB_TOKEN

      # semantic-release only releases when it finds a releasable commit, and the
      # angular convention this repo is configured with does not treat `chore:` or
      # `docs:` as one. This step ran on `if: success()` regardless, so a merge with
      # no releasable commit published the version already in package.json, which
      # npm rejects with "You cannot publish over the previously published
      # versions". Compare against the registry instead, and publish only when
      # there is something new.
      - name: Publish to npm with trusted publisher
        id: publish
        if: success()
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_version=$(npm view @sasjs/lint version 2>/dev/null || echo "")

          if [ "$local_version" = "$published_version" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to publish - $local_version is already on npm"
            exit 0
          fi

          npm publish --access public
          echo "released=true" >> "$GITHUB_OUTPUT"
