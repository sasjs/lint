# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: SASjs Lint Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One release at a time. Both triggers publish, and the push trigger fires on
# every release commit @semantic-release/git pushes back to main, so a
# dispatched recovery run can interleave with a push-triggered one. Two
# semantic-release processes racing the same tag and the same npm publish is a
# new way to strand a release - the state the retry below exists to recover.
# `cancel-in-progress: false` queues the second run rather than cancelling the
# first, because cancelling a run midway through a release is itself a way to
# leave a tag pushed and the release missing.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # required for npm provenance (trusted publisher)
      issues: write         # optional: lets @semantic-release/github comment on issues
      pull-requests: write  # optional: lets @semantic-release/github comment on PRs

    strategy:
      matrix:
        node-version: [22]

    steps:
      # Mint a short-lived GitHub App token (bypass-capable)
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Checkout using the app token so the release commit can be pushed
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0      # semantic-release needs full history + tags

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x — OIDC trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Style
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Project
        run: npm run build

      - name: Clean up ready for publishing
        run: npm run publishInit

      - name: Semantic Release
        # The release toolchain is deliberately not a project dependency: every
        # @semantic-release plugin declares a `semantic-release` peer, which npm
        # auto-installs together with the `npm` package semantic-release bundles
        # - and that bundled npm carries advisories nothing here can fix.
        # Installing it here, pinned, keeps the dependency tree clean. Keep
        # these versions in step with `release.plugins` in package.json.
        #
        # semantic-release pushes twice: @semantic-release/git pushes the release
        # commit to the branch, then core pushes the tag in a second, tags-only
        # push. When that second push is rejected the branch keeps the release
        # commit - package.json at the new version - with no tag: no GitHub
        # release, no npm publish, and every later run dying in the exec plugin's
        # `npm version` with "Version not changed", a state only a hand repair
        # clears. sasjs/adapter hit exactly that on 2026-10-17.
        #
        # The tag push runs after the tag exists locally and after the branch is
        # updated, so one more attempt has only the tag to push. Retry exactly
        # that case: a local tag alone does not identify it, because the tag is
        # also there when the failure came later (the GitHub release), and
        # retrying that finds the tag restored by semantic-release's own fetch,
        # decides there is nothing to release, exits 0 and leaves the step green
        # with the release still missing - so require the tag to be absent from
        # the remote as well.
        #
        # Only a definitive answer counts. `git ls-remote --exit-code` exits 2 for
        # an absent ref but 128 when the query itself fails (network, auth,
        # unreachable remote), and treating every non-zero exit as "absent" would
        # retry on the transient GitHub-side failures that are the very class of
        # incident this retry repairs. So 2 retries, 0 and anything else fail the
        # step.
        run: |
          run_release() {
            npx --yes \
              --package semantic-release@25.0.9 \
              --package @semantic-release/exec@7.1.0 \
              --package @semantic-release/git@11.0.1 \
              semantic-release
          }

          if run_release; then
            exit 0
          fi

          version=$(node -p "require('./package.json').version")

          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "No local v$version tag, so the failure came before the tag was created - not retrying." >&2
            exit 1
          fi

          ls_rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1 || ls_rc=$?

          if [ "$ls_rc" -eq 0 ]; then
            echo "v$version is already on the remote, so the failure came after the tag push - not retrying." >&2
            exit 1
          fi

          if [ "$ls_rc" -ne 2 ]; then
            echo "Could not establish whether v$version is on the remote (git ls-remote exited $ls_rc) - not retrying." >&2
            exit 1
          fi

          echo "Retrying: v$version exists locally but not on the remote, so the tag push is what failed."
          git tag -d "v$version"
          run_release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}   # <-- app token, not secrets.GITHUB_TOKEN

      # semantic-release only releases when it finds a releasable commit, and the
      # angular convention this repo is configured with does not treat `chore:` or
      # `docs:` as one. This step ran on `if: success()` regardless, so a merge with
      # no releasable commit published the version already in package.json, which
      # npm rejects with "You cannot publish over the previously published
      # versions". Compare against the registry instead, and publish only when
      # there is something new.
      - name: Publish to npm with trusted publisher
        id: publish
        if: success()
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_version=$(npm view @sasjs/lint version 2>/dev/null || echo "")

          if [ "$local_version" = "$published_version" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to publish - $local_version is already on npm"
            exit 0
          fi

          npm publish --access public
          echo "released=true" >> "$GITHUB_OUTPUT"
